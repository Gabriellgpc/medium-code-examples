[project]
name = "yolonas-rfdetr-benchmark"
version = "0.1.0"
description = "Benchmark comparing RF-DETR and YOLO-NAS models on COCO validation"
readme = "README.md"
authors = [
    { name = "Luis Condados", email = "condadoslgpc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rfdetr[train]>=1.6.4,<1.7",
    "supervision>=0.25.1",
    "fiftyone>=1.4.1",
    "click",
    "tabulate",
    "loguru",
    "torch",
    "torchvision",
    "openvino>=2024.0",
    "nncf",
    "onnx",
    "onnxscript>=0.6.2",
    "setuptools<82",
    "matplotlib",
    "modern-yolonas",
    "nvidia-cudnn-cu12>=9.21.0.82",
    "nvidia-cusparselt-cu12>=0.8.1",
    "nvidia-cuda-cccl-cu12>=12.9.27",
    "nvidia-nccl-cu12>=2.29.7",
    "nvidia-nvshmem-cu12>=3.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
environments = ["python_version >= '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["tokenizers>=0.20"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
modern-yolonas = { path = "../../modern-yolonas", editable = true }
